allow = ["Bash=npm ls vue vite 2>$null; if ($?) { \"deps ok\" }", "Bash=$p = 'D:\\VSCodeProjects\\drive-model-backend\\app\\modules\\anime\\router.py'; Test-Path $p; (Get-Item $p).Length", "Bash=$p = 'D:\\VSCodeProjects\\drive-model-backend\\app\\modules\\anime\\routerspa.txt'; Set-Content -Path $p -Value 'test' -NoNewline; Test-Path $p; Remove-Item $p", "Bash=$content = @'\n# app/modules/anime/router.py\n# 动漫人物介绍模块：内置一批「经典 + 热门」混合的动漫角色资料，\n# 提供列表与详情只读接口，公开访问，无需登录鉴权。\nfrom fastapi import APIRouter, HTTPException\n\nrouter = APIRouter(prefix=\"/anime\", tags=[\"Anime 动漫人物介绍\"])\n\n# 内置动漫人物资料库（经典 + 热门混合）\nANIME_CHARACTERS = [\n    {\n        \"id\": 1,\n        \"name\": \"漩涡鸣人\",\n        \"name_en\": \"Naruto Uzumaki\",\n        \"work\": \"火影忍者\",\n        \"work_en\": \"Naruto\",\n        \"avatar\": \"🍥\",\n        \"tags\": [\"热血\", \"励志\", \"忍者\"],\n        \"voice_actor\": \"竹内顺子\",\n        \"personality\": \"执着、乐观、永不放弃\",\n        \"introduction\": (\n            \"木叶隐村的忍者，体内封印着九尾妖狐。从小被村民排挤，却始终怀揣成为火影的梦想。\"\n            \"他以超乎常人的毅力和行动力，一步步赢得认可，最终继承火之意志，成为受人爱戴的第七代火影。\"\n        ),\n        \"quote\": \"\\\"说到做到，就是我的忍道！\\\"\"\n    },\n    {\n        \"id\": 2,\n        \"name\": \"毛利小五郎\",\n        \"name_en\": \"Kogoro Mouri\",\n        \"work\": \"名侦探柯南\",\n        \"work_en\": \"Detective Conan\",\n        \"avatar\": \"🕵️\",\n        \"tags\": [\"推理\", \"侦探\", \"大叔\"],\n        \"voice_actor\": \"神谷明 / 小山力也\",\n        \"personality\": \"表面糊涂、关键时可靠\",\n        \"introduction\": (\n            \"东京著名的私人侦探，人称\\\"沉睡的小五郎\\\"。看似大大咧咧、嗜酒爱赌，\"\n            \"但办案时往往在睡梦中\\\"灵光一现\\\"道破真相。是毛利兰的父亲，也是柯南的\\\"破案替身\\\"。\"\n        ),\n        \"quote\": \"\\\"真相只有一个...??\\\"\"\n    },\n    {\n        \"id\": 3,\n        \"name\": \"樱木花道\",\n        \"name_en\": \"Hanamichi Sakuragi\",\n        \"work\": \"灌篮高手\",\n        \"work_en\": \"Slam Dunk\",\n        \"avatar\": \"🏀\",\n        \"tags\": [\"运动\", \"篮球\", \"热血\"],\n        \"voice_actor\": \"草尾毅\",\n        \"personality\": \"自信爆棚、天赋异禀、不服输\",\n        \"introduction\": (\n            \"湘北高中篮球队的\\\"天才\\\"前锋，原是问题少年，为了追女孩加入篮球部。\"\n            \"凭借惊人的弹跳力与学习能力，从门外汉成长为球队不可或缺的篮板王，\"\n            \"用热血与汗水诠释了\\\"篮球人生\\\"。\"\n        ),\n        \"quote\": \"\\\"我是天才，哈哈哈哈哈！\\\"\"\n    },\n    {\n        \"id\": 4,\n        \"name\": \"碇真嗣\",\n        \"name_en\": \"Shinji Ikari\",\n        \"work\": \"新世纪福音战士\",\n        \"work_en\": \"Neon Genesis Evangelion\",\n        \"avatar\": \"🤖\",\n        \"tags\": [\"机战\", \"心理\", \"哲学\"],\n        \"voice_actor\": \"绪方惠美\",\n        \"personality\": \"内向、敏感、渴望被认可\",\n        \"introduction\": (\n            \"EVA 初号机驾驶员，性格内向而敏感，被父亲召唤驾驶 EVA 对抗使徒。\"\n            \"他不断在逃避与现实之间挣扎，其复杂的心路历程成为 EVA 这部充满哲学思辨作品的核心。\"\n        ),\n        \"quote\": \"\\\"不能逃避，不能逃避，不能逃避！\\\"\"\n    },\n    {\n        \"id\": 5,\n        \"name\": \"路飞\",\n        \"name_en\": \"Monkey D. Luffy\",\n        \"work\": \"海贼王\",\n        \"work_en\": \"One Piece\",\n        \"avatar\": \"🏴\u200d☠️\",\n        \"tags\": [\"冒险\", \"热血\", \"伙伴\"],\n        \"voice_actor\": \"田中真弓\",\n        \"personality\": \"自由、纯粹、重情重义\",\n        \"introduction\": (\n            \"草帽海贼团船长，橡胶果实能力者，梦想成为海贼王。他天真自由、毫无心机，\"\n            \"却对伙伴极度重视，为了他们可以不惜一切。一路航行，集结伙伴，追逐\\\"ONE PIECE\\\"。\"\n        ),\n        \"quote\": \"\\\"我是要成为海贼王的男人！\\\"\"\n    },\n    {\n        \"id\": 6,\n        \"name\": \"龙猫小月与小梅\",\n        \"name_en\": \"Satsuki & Mei Kusakabe\",\n        \"work\": \"龙猫\",\n        \"work_en\": \"My Neighbor Totoro\",\n        \"avatar\": \"🌳\",\n        \"tags\": [\"治愈\", \"奇幻\", \"童年\"],\n        \"voice_actor\": \"坂本千夏 / 重井船人\",\n        \"personality\": \"天真烂漫、充满好奇心\",\n        \"introduction\": (\n            \"《龙猫》中搬去乡下居住的两姐妹。妹妹小梅天真烂漫，发现了森林里的龙猫；\"\n            \"姐姐小月则懂事坚强。她们的故事讲述了大自然与童年的纯真美好，是吉卜力最治愈的经典。\"\n        ),\n        \"quote\": \"\\\"龙猫巴士，快来接我们吧！\\\"\"\n    },\n    {\n        \"id\": 7,\n        \"name\": \"五条悟\",\n        \"name_en\": \"Satoru Gojo\",\n        \"work\": \"咒术回战\",\n        \"work_en\": \"Jujutsu Kaisen\",\n        \"avatar\": \"🕶️\",\n        \"tags\": [\"战斗\", \"咒术\", \"最强\"],\n        \"voice_actor\": \"中村悠一\",\n        \"personality\": \"强大自信、玩世不恭、护短\",\n        \"introduction\": (\n            \"东京咒术高专教师，被称作\\\"现代最强的咒术师\\\"，拥有\\\"无下限术式\\\"与\\\"六眼\\\"。\"\n            \"外表轻佻爱玩，实则实力深不可测，对弟子们倾注心血，是咒术界公认的顶尖存在。\"\n        ),\n        \"quote\": \"\\\"全盛期，我当定了你的老师。\\\"\"\n    },\n    {\n        \"id\": 8,\n        \"name\": \"三笠·阿克曼\",\n        \"name_en\": \"Mikasa Ackerman\",\n        \"work\": \"进击的巨人\",\n        \"work_en\": \"Attack on Titan\",\n        \"avatar\": \"⚔️\",\n        \"tags\": [\"战斗\", \"立体机动\", \"守护\"],\n        \"voice_actor\": \"石川由依\",\n        \"personality\": \"冷静、坚韧、守护型\",\n        \"introduction\": (\n            \"调查兵团士兵，阿克曼家族的末裔，拥有超人般的战斗天赋。\"\n            \"她外表冷峻，内心却无比珍视家人般的存在，一生都在为了守护重要之人而战斗。\"\n        ),\n        \"quote\": \"\\\"只要我还活着，就一定会保护你。\\\"\"\n    },\n    {\n        \"id\": 9,\n        \"name\": \"灶门炭治郎\",\n        \"name_en\": \"Tanjiro Kamado\",\n        \"work\": \"鬼灭之刃\",\n        \"work_en\": \"Demon Slayer\",\n        \"avatar\": \"🗡️\",\n        \"tags\": [\"热血\", \"亲情\", \"除恶\"],\n        \"voice_actor\": \"花江夏树\",\n        \"personality\": \"温柔、坚韧、充满同理心\",\n        \"introduction\": (\n            \"善良温柔的少年，一家惨遭鬼杀后，肩负起让变成鬼的妹妹祢豆子恢复人身的使命。\"\n            \"他手持日之呼吸，加入鬼杀队，在斩鬼之路上对敌人也抱持着悲悯，是鬼灭之刃的灵魂人物。\"\n        ),\n        \"quote\": \"\\\"一起变强，绝不放弃。\\\"\"\n    },\n    {\n        \"id\": 10,\n        \"name\": \"利威尔·阿克曼\",\n        \"name_en\": \"Levi Ackerman\",\n        \"work\": \"进击的巨人\",\n        \"work_en\": \"Attack on Titan\",\n        \"avatar\": \"🪓\",\n        \"tags\": [\"战斗\", \"兵长\", \"洁癖\"],\n        \"voice_actor\": \"神谷浩史\",\n        \"personality\": \"冷酷、强大、外冷内热\",\n        \"introduction\": (\n            \"调查兵团特别作战班班长，被称为\\\"人类最强士兵\\\"。拥有无解的立体机动战斗技巧，\"\n            \"外表冷酷寡言、有严重洁癖，实则内心珍视部下与同伴，是战场上最可靠的领袖。\"\n        ),\n        \"quote\": \"\\\"选择吧，后悔你的人生，或者认同你的人生。\\\"\"\n    },\n    {\n        \"id\": 11,\n        \"name\": \"小智\",\n        \"name_en\": \"Ash Ketchum\",\n        \"work\": \"宝可梦\",\n        \"work_en\": \"Pokémon\",\n        \"avatar\": \"⚡\",\n        \"tags\": [\"冒险\", \"伙伴\", \"成长\"],\n        \"voice_actor\": \"松本梨香\",\n        \"personality\": \"热情、勇敢、与宝可梦心灵相通\",\n        \"introduction\": (\n            \"真新镇出身、梦想成为宝可梦大师的少年训练家。他与皮卡丘结下深厚羁绊，\"\n            \"一路旅行挑战各地道馆，结识伙伴，在无数对战中不断成长，陪伴了无数观众的童年。\"\n        ),\n        \"quote\": \"\\\"皮卡丘，就决定是你了！\\\"\"\n    },\n    {\n        \"id\": 12,\n        \"name\": \"芙莉莲\",\n        \"name_en\": \"Frieren\",\n        \"work\": \"葬送的芙莉莲\",\n        \"work_en\": \"Frieren: Beyond Journey's End\",\n        \"avatar\": \"🧙\",\n        \"tags\": [\"奇幻\", \"时间\", \"治愈\"],\n        \"voice_actor\": \"种崎敦美\",\n        \"personality\": \"淡漠而温柔、长寿精灵\",\n        \"introduction\": (\n            \"打败魔王后继续旅行的长寿精灵魔法使。对于人类而言短暂的几十年，\"\n            \"对她来说转瞬即逝。她踏上一段重新理解人类、理解\\\"逝去\\\"与\\\"羁绊\\\"的追忆之旅，\"\n            \"是近年现象级动漫《葬送的芙莉莲》的主角。\"\n        ),\n        \"quote\": \"\\\"魔王，已经讨伐完成了呢。\\\"\"\n    },\n]\n\n# 1. 获取动漫人物列表（支持按关键词 name / work 过滤）\n@router.get(\"/list\")\nasync def get_anime_list(keyword: str = \"\"):\n    keyword = keyword.strip().lower()\n    characters = ANIME_CHARACTERS\n    if keyword:\n        characters = [\n            c for c in characters\n            if keyword in c[\"name\"].lower()\n            or keyword in c[\"work\"].lower()\n            or keyword in c[\"name_en\"].lower()\n            or keyword in c[\"work_en\"].lower()\n        ]\n    # 列表返回精简字段，避免一次性传输过长介绍\n    result = [\n        {\n            \"id\": c[\"id\"],\n            \"name\": c[\"name\"],\n            \"name_en\": c[\"name_en\"],\n            \"work\": c[\"work\"],\n            \"avatar\": c[\"avatar\"],\n            \"tags\": c[\"tags\"],\n        }\n        for c in characters\n    ]\n    return {\"success\": True, \"total\": len(result), \"characters\": result}\n\n# 2. 获取单个动漫人物详情\n@router.get(\"/{character_id}\")\nasync def get_anime_detail(character_id: int):\n    for c in ANIME_CHARACTERS:\n        if c[\"id\"] == character_id:\n            return {\"success\": True, \"character\": c}\n    raise HTTPException(status_code=404, detail=\"未找到该动漫人物\")\n'@\nSet-Content -Path 'D:\\VSCodeProjects\\drive-model-backend\\app\\modules\\anime\\router.py' -Value $content -Encoding UTF8\n(Get-Item 'D:\\VSCodeProjects\\drive-model-backend\\app\\modules\\anime\\router.py').Length", "Bash=$p = 'D:\\VSCodeProjects\\drive-model-backend\\app\\main.py'\n$c = Get-Content -Path $p -Raw\n# 在 admin_router 导入后追加 anime 导入\n$c = $c.Replace(\"from app.modules.admin.router import router as admin_router\", \"from app.modules.admin.router import router as admin_router`nfrom app.modules.anime.router import router as anime_router\")\n# 在 admin include_router 后追加 anime 挂载\n$c = $c.Replace(\"app.include_router(admin_router)\", \"app.include_router(admin_router)`napp.include_router(anime_router)\")\nSet-Content -Path $p -Value $c -Encoding UTF8 -NoNewline\nGet-Content -Path $p | Select-String -Pattern 'anime'", "Bash=cd D:\\VSCodeProjects\\drive-model-backend; & \".\\venv\\Scripts\\python.exe\" -c \"import ast; ast.parse(open('app/modules/anime/router.py', encoding='utf-8').read()); ast.parse(open('app/main.py', encoding='utf-8').read()); print('syntax ok')\""]
